server.port=${PORT:8085}

# Database configuration (Defaults to persistent H2 file, overrides with environment variables in Render/Postgres)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/kisaandb;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# External API Keys (Can be supplied via Environment Variables or directly here)
gemini.api.key=${GEMINI_API_KEY:}
weather.api.key=${OPENWEATHERMAP_API_KEY:}

# File upload limits for crop image scanner
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
