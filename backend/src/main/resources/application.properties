server.port=${PORT:8085}

# Local PostgreSQL Database configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/kisaandb}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Abhinav12##@}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# External API Keys (Can be supplied via Environment Variables or directly here)
gemini.api.key=${GEMINI_API_KEY:}
weather.api.key=${OPENWEATHERMAP_API_KEY:}

# File upload limits for crop image scanner
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# AI Microservice URL (FastAPI + PyTorch)
ai.service.url=${AI_SERVICE_URL:http://127.0.0.1:8088}

