server.port=8085

# Persistent H2 Database configuration (saved to disk in ./data/kisaandb)
spring.datasource.url=jdbc:h2:file:./data/kisaandb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# External API Keys (Can be supplied via Environment Variables or directly here)
gemini.api.key=${GEMINI_API_KEY:}
weather.api.key=${OPENWEATHERMAP_API_KEY:}

# File upload limits for crop image scanner
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
